# 研究回放(次日 T 价位研究 V1)标的与参数配置。
# 设计: docs/superpowers/specs/2026-09-18-next-day-t-research-replay-design.md
# 加标的只改本文件不改代码; symbol 用规范代码(带交易所后缀)。
history_start: "2013-01-01"          # 日线拉取下界(请求下界, 非保证; 上市晚的标的从上市日起有数据)
# 数据源路由(2026-09-18 换源决策, 用户显式批准): 东财 push2* 对阿里云 ECS IP 封禁,
# 改走 腾讯 fqkline 日线 + 新浪 hfq.js 权益事件日历 + 新浪交易日历。
# 不静默换源: 改这里必须同步设计文档「数据源决策记录」。
data_source: "tencent"
# r_t=raw_close/hfq_close 相对阶跃的宽 sanity 阈值(权益事件以事件日历为主检测)。
# 腾讯 hfq 比值非事件日有 0.1%~0.4% 抖动, 旧窄容差 0.002 在该源下会误报; 5% 只拦真实异常。
corporate_action_tolerance: 0.05
targets:
