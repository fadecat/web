<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>市场数据平台</title>
    <script>
      // 防闪屏: 在应用 bundle 执行前同步恢复主题类。
      // 键名 'app-theme' 须与 src/stores/theme.js 的 STORAGE_KEY 保持一致。
      (function () {
        try {
          var m = localStorage.getItem('app-theme') || 'auto';
          var dark =
            m === 'dark' ||
            (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* 读不到(隐私模式等)就按默认浅色渲染 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
