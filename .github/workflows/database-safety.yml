name: database-safety

on:
  push:
  pull_request:

jobs:
  database-tools:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/test_backup_restore.py tests/test_database_adoption.py tests/test_cli_entrypoints.py
